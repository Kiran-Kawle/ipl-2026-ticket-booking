<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IPL Ticket Booking Form</title>

    <!-- Link Existing CSS File -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="navbar">
        <h1>IPL 2026 Ticket Booking</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#matches">Matches</a>
            <a href="booking.html">Book Ticket</a>
            <a href="index.html#guidelines">Guidelines</a>
        </nav>
    </header>

    <main>

        <section class="booking-form">

            <h2>IPL Ticket Booking Form</h2>

            <form action="#" method="get">

                <!-- Full Name -->
                <label for="name">Full Name:</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    minlength="3"
                    maxlength="40"
                    pattern="[A-Za-z ]+"
                    required>

                <br><br>

                <!-- Email -->
                <label for="email">Email Address:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

                <br><br>

                <!-- Phone Number -->
                <label for="phone">Phone Number:</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter 10 digit phone number"
                    pattern="[6-9][0-9]{9}"
                    minlength="10"
                    maxlength="10"
                    title="Please enter a valid 10-digit mobile number starting with 6, 7, 8, or 9"
                    required>

                <br><br>

                <!-- Match Selection -->
                <label for="match">Select Match:</label>

                <select id="match" name="match" required>

                    <option value="">Choose Match</option>
                    <option value="RCB vs CSK">RCB vs CSK</option>
                    <option value="MI vs KKR">MI vs KKR</option>
                    <option value="SRH vs RR">SRH vs RR</option>
                    <option value="DC vs PBKS">DC vs PBKS</option>
                    <option value="GT vs LSG">GT vs LSG</option>

                </select>

                <br><br>

                <!-- Stand Category -->
                <label for="stand">Stand Category:</label>

                <select id="stand" name="stand" required>

                    <option value="">Choose Stand</option>
                    <option value="General">General</option>
                    <option value="Premium">Premium</option>
                    <option value="VIP">VIP</option>

                </select>

                <br><br>

                <!-- Number of Tickets -->
                <label for="quantity">Number of Tickets:</label>

                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    min="1"
                    max="10"
                    required>

                <br><br>

                <!-- Booking Preference -->
                <fieldset>

                    <legend>Payment Preference</legend>

                    <input
                        type="radio"
                        id="online"
                        name="payment"
                        value="Online Payment">

                    <label for="online">Online Payment</label>

                    <input
                        type="radio"
                        id="counter"
                        name="payment"
                        value="Counter Payment">

                    <label for="counter">Counter Payment</label>

                </fieldset>

                <br>

                <!-- Submit and Reset -->
                <button type="submit">Confirm Booking</button>

                <button type="reset">Reset Form</button>

            </form>

            <br>

            <a href="index.html">Back to Home</a>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 IPL Ticket Booking Website. All Rights Reserved.</p>
    </footer>

</body>
</html>
